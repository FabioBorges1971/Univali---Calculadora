<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f2937, #111827);
    }

    .calculadora {
      width: 320px;
      background: #1f1f1f;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .display {
      width: 100%;
      height: 70px;
      margin-bottom: 16px;
      border: none;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      text-align: right;
      padding: 16px;
      font-size: 2rem;
      outline: none;
    }

    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 58px;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .numero {
      background: #374151;
      color: #fff;
    }

    .operador {
      background: #f59e0b;
      color: #111827;
      font-weight: bold;
    }

    .acao {
      background: #ef4444;
      color: #fff;
    }

    .igual {
      background: #10b981;
      color: #fff;
      grid-column: span 2;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculadora">
    <input type="text" id="display" class="display" disabled value="0" />

    <div class="botoes">
      <button class="acao" onclick="limparDisplay()">C</button>
      <button class="acao" onclick="apagarUltimo()">⌫</button>
      <button class="operador" onclick="adicionarValor('%')">%</button>
      <button class="operador" onclick="adicionarValor('/')">÷</button>

      <button class="numero" onclick="adicionarValor('7')">7</button>
      <button class="numero" onclick="adicionarValor('8')">8</button>
      <button class="numero" onclick="adicionarValor('9')">9</button>
      <button class="operador" onclick="adicionarValor('*')">×</button>

      <button class="numero" onclick="adicionarValor('4')">4</button>
      <button class="numero" onclick="adicionarValor('5')">5</button>
      <button class="numero" onclick="adicionarValor('6')">6</button>
      <button class="operador" onclick="adicionarValor('-')">−</button>

      <button class="numero" onclick="adicionarValor('1')">1</button>
      <button class="numero" onclick="adicionarValor('2')">2</button>
      <button class="numero" onclick="adicionarValor('3')">3</button>
      <button class="operador" onclick="adicionarValor('+')">+</button>

      <button class="numero zero" onclick="adicionarValor('0')">0</button>
      <button class="numero" onclick="adicionarValor('.')">.</button>
      <button class="igual" onclick="calcular()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function adicionarValor(valor) {
      if (display.value === '0' || display.value === 'Erro') {
        if ('+-*/%'.includes(valor)) {
          display.value += valor;
        } else {
          display.value = valor;
        }
      } else {
        display.value += valor;
      }
    }

    function limparDisplay() {
      display.value = '0';
    }

    function apagarUltimo() {
      if (display.value.length <= 1 || display.value === 'Erro') {
        display.value = '0';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function calcular() {
      try {
        const resultado = eval(display.value);
        display.value = Number.isFinite(resultado) ? resultado : 'Erro';
      } catch {
        display.value = 'Erro';
      }
    }

    document.addEventListener('keydown', (event) => {
      const tecla = event.key;

      if ((tecla >= '0' && tecla <= '9') || '+-*/%.'.includes(tecla)) {
        adicionarValor(tecla);
      } else if (tecla === 'Enter') {
        calcular();
      } else if (tecla === 'Backspace') {
        apagarUltimo();
      } else if (tecla === 'Escape') {
        limparDisplay();
      }
    });
  </script>
</body>
</html>
